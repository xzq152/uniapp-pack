<!doctype html>
<!--
  图标源文件：用 Chrome 无头渲染成 assets/icon-512.png，再交给 tools/mkico 生成多尺寸 ico。
  重新生成见 assets/README.md。

  图形来自 Material Design Icons 的 android（Apache-2.0）；
  蓝色渐变底与圆角是本项目加的，与网页端顶栏 logo 保持一致。
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #wrap {
    width: 512px; height: 512px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 112px;
    background: linear-gradient(135deg, #0052D9 0%, #4B8BFF 100%);
    position: relative;
    overflow: hidden;
  }
  /* 右上角柔光，避免纯色块显得死板 */
  #wrap::after {
    content: '';
    position: absolute;
    top: -160px; right: -160px;
    width: 420px; height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 70%);
  }
  svg { width: 300px; height: 300px; position: relative; z-index: 1; }
  svg path { fill: #FFFFFF; }
</style>
</head>
<body>
  <div id="wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

    </svg>
  </div>
</body>
</html>
