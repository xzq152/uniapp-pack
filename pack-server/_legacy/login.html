<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · uni-app 打包服务</title>
<link rel="stylesheet" href="/static/style.css?v=5">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login { width: 100%; max-width: 320px; margin: 0 20px; }
  .login h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; text-align: center; }
  .login .sub { font-size: 12px; color: var(--text-mute); text-align: center; margin-bottom: 18px; }
  .login .err { color: var(--bad); font-size: 12px; margin-top: 8px; min-height: 17px; }
</style>
</head>
<body>
<form class="card login" id="f">
  <h1>uni-app 安卓打包服务</h1>
  <div class="sub">请输入访问口令</div>
  <div class="field">
    <label>访问口令</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus>
  </div>
  <div class="actions" style="margin-top:14px">
    <button class="btn primary" type="submit" style="width:100%">进入</button>
  </div>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const body = new URLSearchParams({ password: document.getElementById('pw').value });
  const r = await fetch('/api/login', { method: 'POST', body });
  if (r.ok) { location.href = '/'; }
  else { err.textContent = await r.text() || '口令不正确'; }
};
</script>
</body>
</html>
